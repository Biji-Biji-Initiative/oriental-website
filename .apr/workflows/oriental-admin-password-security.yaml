name: oriental-admin-password-security
description: Exact-tree security review for Oriental interactive admin password management

documents:
  readme: .apr/evidence/oriental-admin-password-security.md
  spec: .apr/specs/oriental-admin-password-security.md
  implementation: .apr/evidence/oriental-admin-password-security.patch

oracle:
  model: "gpt-5.6-sol"

rounds:
  output_dir: .apr/rounds/oriental-admin-password-security
  impl_every_n: 1

template: |
  Perform an adversarial exact-tree security and release review of implementation
  commit a79184b5d60aeeb5eca1c8071bfc6d5ba9accb5c using the source-only patch and
  evidence manifest. The owner requires the reaffirmed password even though
  historical repository exposure means it is potentially known. Decide whether
  the signed method=password, viewer-only, thirty-minute session materially
  contains that risk now that it authorizes only PII-free aggregate metrics and
  logout; all customer records, transcripts, voice detail, analytics/queues,
  and mutations require managed-token step-up. Recheck the exact all-extension
  route inventory and structural wrapper hostile fixtures, narrow exhaustive
  minting authority, bearer rejection, password/bearer collision fail-closed
  behavior, distinct signed provenance, HMAC domain separation, rotation,
  Infisical-to-Coolify reconciliation, truthful documentation, and negative
  tests. Do not waive final exact-head CI, combined
  integration, exact-SHA staging, live reduced-session proof, or guarded
  production verification. End with `VERDICT: MERGE` or
  `VERDICT: DO NOT MERGE` on its own final line.

