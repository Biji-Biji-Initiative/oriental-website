name: oriental-admin-password-security
description: Exact-tree security review for Oriental interactive admin password management

documents:
  readme: .apr/evidence/oriental-admin-password-security.md
  spec: .apr/specs/oriental-admin-password-security.md
  implementation: .apr/evidence/oriental-admin-password-security.patch

oracle:
  model: "gpt-5.6-sol"

rounds:
  output_dir: .apr/rounds/oriental-admin-password-security
  impl_every_n: 1

template: |
  Perform an adversarial exact-tree security and release review of implementation
  commit 4dd1eb1bcfcc3240cefdf577c618e2c9fdbf1bd9 using the source-only patch and
  evidence manifest. The owner requires the reaffirmed password even though
  historical repository exposure means it is potentially known. Decide whether
  the signed method=password, viewer-only, thirty-minute session materially
  contains that risk now that it authorizes only a dedicated fixed aggregate
  metrics DTO and logout; all customer records, transcripts, voice detail,
  events, analytics/queues, and mutations require managed-token step-up.
  Recheck every round-seven blocker: every aggregate count must be bounded by
  the normalized query take and obvious subset counts must not exceed their
  parents; authority admission must expand from production roots through every
  repository-local program source and follow referenced function bodies; allowed
  auth exports must resist namespace, alias, property, Object/Reflect, array,
  getter, factory, bind, signer, bearer-verifier, and private WeakMap/claims
  augmentation; supported route extensions must come from effective Next
  loadConfig output, including hostile computed/imported config; release password
  E2E must hard-fail rather than skip and emit a zero-skipped machine report; and
  release evidence must carry immutable GitHub run/job/check-suite identity,
  checked-out SHA/event, integration commit/tree/composition, and hashed
  machine-readable test/audit counts. Confirm GitHub run 30365410287, job/check
  90295268846, suite 82296707933, event pull_request, and source SHA
  4dd1eb1bcfcc3240cefdf577c618e2c9fdbf1bd9. Confirm integration commit
  ed34b5e8c1639af5b97bb834de417b5d03c1acc6, tree
  861800a67e9af8b49a76480ba2cebb812680346a, all eight listed exact PR heads,
  frozen install, lint, strict TypeScript, zero production audit findings across
  378 dependencies, all 89 files and 2,336 tests, and the Next.js 16.2.12 build.
  Verify the Vitest and audit SHA-256 values in the manifest. Compare the live PR
  head with the implementation commit and reject any non-APR descendant change.
  Do not waive exact-SHA staging, mandatory live password release proof, managed
  HMAC readback, or guarded same-SHA production verification. End with
  `VERDICT: MERGE` or `VERDICT: DO NOT MERGE` on its own final line.

