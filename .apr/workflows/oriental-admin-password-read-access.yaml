name: oriental-admin-password-read-access
description: Exact-tree security review for password-viewer full CRM read access

documents:
  readme: .apr/evidence/oriental-admin-password-read-access.md
  spec: .apr/specs/oriental-admin-password-read-access.md
  implementation: .apr/evidence/oriental-admin-password-read-access-source.patch

oracle:
  model: "gpt-5.5-pro"

rounds:
  output_dir: .apr/rounds/oriental-admin-password-read-access
  impl_every_n: 1

template: |
  This is the supported GPT-5.5 Pro review run; ignore any unavailable-model
  browser session with an otherwise similar prompt.

  Perform an adversarial security and release review of implementation commit
  c6d48da1a8ef0dbbc1cc676b4f97d9fe8ee35351 and tree
  192cee4bde43bfa2f323409296255311701dab1f using the attached specification,
  evidence manifest, focused runtime-and-test source diff, and prior round
  responses.

  The intended contract is full CRM read-only access for the interactive
  password principal. Confirm actual customer, email, transcript, and voice
  reads are permitted while all system-state mutation remains managed-token
  only. Recompute the exact commit, tree, focused source-diff byte count and
  SHA-256, and full mail-patch byte count and SHA-256.

  Adversarially trace the canonical permission registry through page rendering,
  raw review APIs, voice-detail APIs, and mutation wrappers. Confirm the
  password principal has only dashboard.aggregate, dashboard.read, leads.read,
  voice.read, and session.logout; has no write or eval permission; cannot act as
  a bearer; stays viewer-only for thirty minutes; and cannot bypass same-origin,
  rate-limit, HMAC, cookie-signing, or principal boundaries. Treat hidden UI
  controls as usability only and require independent server-side 403 denial.

  Inspect component behavior for desktop and mobile selection, bulk actions,
  lead actions, workflow forms, evaluation triggers, archive controls, and
  voice follow-up state. Confirm useful read-only search, filter, sort,
  pagination, navigation, and record detail remain available. Confirm tests
  exercise real fixture data, raw and voice reads, password bearer denial, and
  a real mutation denial. Check docs and release governance for consistency and
  reject any secret or customer-data leakage.

  Treat managed-secret proof, exact-SHA staging, live nonempty CRM/voice reads,
  password bearer rejection, live mutation 403, Redis shared-rate-limit proof,
  identical-SHA production promotion, and post-deploy health as mandatory
  post-merge gates rather than completed evidence.

  Report concrete ship blockers only. End with `VERDICT: MERGE` or
  `VERDICT: DO NOT MERGE` on its own final line.

