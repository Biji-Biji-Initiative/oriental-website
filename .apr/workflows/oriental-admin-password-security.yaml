name: oriental-admin-password-security
description: Exact-tree security review for Oriental interactive admin password management

documents:
  readme: .apr/evidence/oriental-admin-password-security.md
  spec: .apr/specs/oriental-admin-password-security.md
  implementation: .apr/evidence/oriental-admin-password-security.patch

oracle:
  model: "gpt-5.6-sol"

rounds:
  output_dir: .apr/rounds/oriental-admin-password-security
  impl_every_n: 1

template: |
  Perform an adversarial exact-tree security and release review of implementation
  commit 691bb883eaf4cbd30a614779b6b353d5e252ed1e using the source-only patch and
  evidence manifest. The owner requires the reaffirmed password even though
  historical repository exposure means it is potentially known. Decide whether
  the signed method=password, viewer-only, thirty-minute session materially
  contains that risk now that it authorizes only a dedicated fixed aggregate
  metrics DTO and logout; all customer records, transcripts, voice detail,
  events, analytics/queues, and mutations require managed-token step-up.
  Recheck every prior blocker, especially round eight: computed and aliased
  Object/Reflect mutation primitives, transparent Object(value)/Proxy targets,
  destructured export identity, parenthesized/asserted/satisfies/non-null/
  template/constant-concatenated and unresolved CommonJS or dynamic module
  acquisition, alternate-port or non-root canonical release proof, and
  digest-only evidence admission. Also recheck that every aggregate count is
  bounded by the normalized query take and obvious subset counts must not exceed
  their parents; authority admission must expand from production roots through
  every repository-local program source and follow referenced function bodies;
  allowed auth exports must resist namespace, alias, property, Object/Reflect,
  array, getter, factory, bind, signer, bearer-verifier, and private
  WeakMap/claims augmentation; supported route extensions must come from
  effective Next loadConfig output, including hostile computed/imported config;
  release password E2E must hard-fail rather than skip and emit a
  zero-skipped machine report; and release evidence must carry immutable GitHub
  run/job/check-suite identity, checked-out SHA/event, integration commit/tree
  composition, and hashed machine-readable test/audit counts. Confirm GitHub
  run 30373725749, job/check 90323907478, suite 82322165004, event
  pull_request, and source SHA 691bb883eaf4cbd30a614779b6b353d5e252ed1e.
  Confirm integration commit 94c4457a37820d5cfbac220ac4881c19cc296005, tree
  2236e4bf2c93545431c38484ab2326b48cb9dec3, all eight listed exact source
  states, frozen install, lint, strict TypeScript, zero production audit
  findings across 378 dependencies, all 89 files and 2,337 tests, and the
  Next.js 16.2.12 build. Recompute hashes from every attached raw GitHub, git,
  Vitest, and audit support artifact. Compare the attached live PR object and
  source-to-head diff with the implementation commit and reject any non-APR
  descendant change. Do not waive exact-SHA staging, mandatory live password
  release proof, managed HMAC readback, or guarded same-SHA production
  verification. End with `VERDICT: MERGE` or `VERDICT: DO NOT MERGE` on its
  own final line.

