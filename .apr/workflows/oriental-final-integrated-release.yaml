name: oriental-final-integrated-release
description: Final adversarial exact-tree gate for the complete Oriental release

documents:
  readme: docs/12-CHAT-RELEASE-RUNBOOK.md
  spec: .apr/specs/oriental-final-integrated-release.md
  implementation: .apr/evidence/oriental-final-integrated-release.md

oracle:
  model: "gpt-5.2-pro"

rounds:
  output_dir: .apr/rounds/oriental-final-integrated-release
  impl_every_n: 1

template: |
  Perform an adversarial exact-tree pre-merge review of the complete Oriental
  release. Treat privacy leakage, analytics before consent, weak authorization,
  unbounded evaluation spend, inaccessible or overflowing UI, misleading brand
  or experiment gates, lost capture state, misleading telemetry, weakened lead
  durability, incomplete managed-environment convergence, unsafe production
  model changes, or broken exact-SHA proof as blockers. This is a code merge
  gate; do not require post-merge live proof. End with exactly
  `VERDICT: MERGE ORIENTAL RELEASE` or `VERDICT: DO NOT MERGE`.

template_with_impl: |
  Perform an adversarial exact-tree pre-merge review of the complete Oriental
  release against the attached executable evidence. Verify claims against the
  checked-out implementation. Treat privacy leakage, analytics before consent,
  weak authorization, unbounded evaluation spend, inaccessible or overflowing
  UI, misleading brand or experiment gates, lost capture state, misleading
  telemetry, weakened lead durability, incomplete managed-environment
  convergence, unsafe production model changes, or broken exact-SHA proof as
  blockers. This is a code merge gate; do not require post-merge live proof.
  End with exactly `VERDICT: MERGE ORIENTAL RELEASE` or
  `VERDICT: DO NOT MERGE`.
