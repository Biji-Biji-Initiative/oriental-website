name: oriental-admin-password-read-access
description: Exact-tree security review for full password admin access

documents:
  readme: .apr/evidence/oriental-admin-password-read-access.md
  spec: .apr/specs/oriental-admin-password-read-access.md
  implementation: .apr/evidence/oriental-admin-password-read-access-compact.patch

oracle:
  model: "gpt-5.5-pro"

rounds:
  output_dir: .apr/rounds/oriental-admin-password-read-access
  impl_every_n: 1

template: |
  Review the final full-admin implementation. This prompt supersedes every
  earlier read-only password review for this branch.

  Perform an adversarial security and release review of implementation commit
  049f130cac56fc6890b12d2317ef87da7d3082bc and tree
  6e3ee4600fb26c62ed605e7e7571d4be88385ec1 using the specification, evidence
  manifest, compact runtime-and-test diff, and prior round responses.

  The owner explicitly requires the managed human password to be the complete
  interactive administrator. Confirm a verified password login signs
  method=password, role=admin, expires after thirty minutes, and receives every
  permission in ADMIN_PERMISSIONS. Confirm the password remains invalid as a
  bearer and does not become a signing key or plaintext runtime secret.

  Trace read and mutation routes, capability-derived UI, and cookie validation.
  Require same-origin JSON for every unsafe cookie request, HMAC verification,
  constant-time comparison, credential collision failure, signed provenance,
  rate limiting, and unchanged scoped automation/privacy bearer behavior.
  Confirm tests prove nonempty reads, visible admin controls, bearer rejection,
  and protected mutation admission via 400 invalid_payload without changing a
  real record. Reject a UI-only authorization claim.

  Recompute the commit/tree and both diff byte counts and SHA-256 values. Check
  docs for the same contract and reject any credential or customer-data leak.
  Treat hidden-input live password proof, exact-SHA staging, shared Redis proof,
  identical-SHA production promotion, and health verification as mandatory
  post-merge gates.

  Report concrete ship blockers only. End with `VERDICT: MERGE` or
  `VERDICT: DO NOT MERGE` on its own final line.

