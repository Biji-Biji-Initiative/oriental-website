name: oriental-dropped-session-observability
description: Exact-range data-integrity review for lost close snapshots and orphan alerts

documents:
  readme: .apr/evidence/oriental-dropped-session-observability.md
  spec: .apr/specs/oriental-dropped-session-observability.md
  implementation: .apr/evidence/oriental-dropped-session-observability.patch

oracle:
  model: "gpt-5.6-sol"

rounds:
  output_dir: .apr/rounds/oriental-dropped-session-observability
  impl_every_n: 1

template: |
  Perform an adversarial exact-range data-integrity and operations review of
  Oriental dropped-session implementation commit
  caa2ff15b6c5ca44f8e376f3784fee4db0356639. Review the complete patch after
  stacked base 75f42e3205ac65f50e0a76bd7a58a2b651726ad2. Recheck every
  round-one blocker: lifecycle membership must be selected by a compound index
  before the cap; real orphans must not age out through a lower lookback; the
  stale floor must derive from the maximum valid call and heartbeat policy;
  failed, timed-out, or migration-pending telemetry must remain unknown rather
  than zero; the secondary plane must have bounded latency; the release
  migration must be bounded and non-destructive; and both web deploy
  entrypoints must fail before external mutation unless Convex is deployed,
  migrated, and queryable. Also confirm client failure reporting stays PII-free
  and only ops automation can invoke the SLA route. End with `VERDICT: MERGE`
  or `VERDICT: DO NOT MERGE` on its own final line.

template_with_impl: |
  Perform an adversarial exact-range data-integrity and operations review of
  Oriental dropped-session implementation commit
  caa2ff15b6c5ca44f8e376f3784fee4db0356639 against the attached source-only
  patch after stacked base 75f42e3205ac65f50e0a76bd7a58a2b651726ad2.
  Recheck every round-one blocker: lifecycle membership must be selected by a
  compound index before the cap; real orphans must not age out through a lower
  lookback; the stale floor must derive from the maximum valid call and
  heartbeat policy; failed, timed-out, or migration-pending telemetry must
  remain unknown rather than zero; the secondary plane must have bounded
  latency; the release migration must be bounded and non-destructive; and both
  web deploy entrypoints must fail before external mutation unless Convex is
  deployed, migrated, and queryable. Also confirm client failure reporting
  stays PII-free and only ops automation can invoke the SLA route. End with
  `VERDICT: MERGE` or `VERDICT: DO NOT MERGE` on its own final line.
