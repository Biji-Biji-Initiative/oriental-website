name: oriental-admin-password-security
description: Exact-tree security review for Oriental interactive admin password management

documents:
  readme: .apr/evidence/oriental-admin-password-security.md
  spec: .apr/specs/oriental-admin-password-security.md
  implementation: .apr/evidence/0001-fix-auth-manage-interactive-password.patch

oracle:
  model: "gpt-5.6-sol"

rounds:
  output_dir: .apr/rounds/oriental-admin-password-security
  impl_every_n: 1

template: |
  Perform an adversarial exact-tree security and release review of implementation
  commit f21791098715a4c28db2695227784c78b8f4afad using the complete mail patch and
  evidence manifest. The owner explicitly requires the reaffirmed convenience
  password even though earlier repository history means it must be treated as
  potentially known; do not treat password secrecy as a control. Decide whether
  the login-only boundary, same-origin JSON enforcement, proxy-owned rate limit,
  distinct credential provenance, bearer rejection, domain-separated HMACs,
  rotation behavior, managed Infisical-to-Coolify reconciliation, documentation,
  and negative tests adequately contain that risk without weakening bearer or
  session authority. Staging and production secret materialization can only occur
  after merge; retain exact-SHA staging, live login, bearer rejection, and
  production verification as mandatory post-merge gates. Decide whether this
  implementation may merge. End with `VERDICT: MERGE` or
  `VERDICT: DO NOT MERGE` on its own final line.

