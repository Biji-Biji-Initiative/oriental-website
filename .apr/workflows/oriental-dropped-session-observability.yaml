  heartbeat policy; failed, timed-out, or either migration-pending population
  must remain unknown rather than zero; both unsafe legacy rows and safe rows
  missing lifecycle state must be checked with bounded queries; the lifecycle
  release mutation must patch only sessionState and preserve every
  non-lifecycle field exactly; unsafe payload normalization/retention must remain
  separately governed; query, RPC, and total child-process latency must be
  bounded with process-group kill before external mutation; and both web deploy
  entrypoints must fail before external mutation unless Convex is deployed,
  migrated, and queryable. Also confirm client failure reporting
  stays PII-free and only ops automation can invoke the SLA route. End with
