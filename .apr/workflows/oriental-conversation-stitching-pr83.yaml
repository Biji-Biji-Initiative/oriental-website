name: oriental-conversation-stitching-pr83
description: Exact-tree privacy and grouping review for resumed voice calls

documents:
  readme: .apr/evidence/oriental-conversation-stitching-pr83.md
  spec: .apr/specs/oriental-conversation-stitching.md
  implementation: .apr/evidence/oriental-conversation-stitching-pr83.patch

oracle:
  model: "gpt-5.6-sol"

rounds:
  output_dir: .apr/rounds/oriental-conversation-stitching-pr83
  impl_every_n: 1

template: |
  Perform an adversarial exact-source privacy and data-integrity review of
  conversation-grouping implementation commit
  4a79dad0cc1331e3fb9a53cb9b107c7ebdd98344. Recheck every round-one
  blocker: explicit IDs must be trimmed, nonempty, and namespaced away from
  review IDs; inferred edges must require one consistent valid normalized
  email on every call and reject raw, missing, malformed, or conflicting
  identity; the sixty-minute test must compare actual calls rather than sparse
  intervals; nearest-cluster selection and every equal-time ordering must be
  deterministic under input permutations; every row must remain inspectable
  exactly once; and inputs and persistence must not mutate. Do not waive
  exact-head CI, combined-tree admission, or final staging verification. End
  with `VERDICT: MERGE` or `VERDICT: DO NOT MERGE` on its own final line.

template_with_impl: |
  Perform an adversarial exact-source privacy and data-integrity review of
  conversation-grouping implementation commit
  4a79dad0cc1331e3fb9a53cb9b107c7ebdd98344 against the attached complete
  source-only patch. Recheck every round-one blocker: explicit IDs must be
  trimmed, nonempty, and namespaced away from review IDs; inferred edges must
  require one consistent valid normalized email on every call and reject raw,
  missing, malformed, or conflicting identity; the sixty-minute test must
  compare actual calls rather than sparse intervals; nearest-cluster selection
  and every equal-time ordering must be deterministic under input
  permutations; every row must remain inspectable exactly once; and inputs and
  persistence must not mutate. Do not waive exact-head CI, combined-tree
  admission, or final staging verification. End with `VERDICT: MERGE` or
  `VERDICT: DO NOT MERGE` on its own final line.
