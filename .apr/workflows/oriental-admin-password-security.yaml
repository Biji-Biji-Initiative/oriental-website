name: oriental-admin-password-security
description: Exact-tree security review for Oriental interactive admin password management

documents:
  readme: .apr/evidence/oriental-admin-password-security.md
  spec: .apr/specs/oriental-admin-password-security.md
  implementation: .apr/evidence/oriental-admin-password-security.patch

oracle:
  model: "gpt-5.6-sol"

rounds:
  output_dir: .apr/rounds/oriental-admin-password-security
  impl_every_n: 1

template: |
  Perform an adversarial exact-tree security and release review of implementation
  commit 1142708546e31e1f1ed225448ae955e0059e6a11, tree
  0bb7c3de96316c7bd1832c3efc303d8d21a99614, using the source-only patch and
  evidence manifest. The owner requires the reaffirmed password even though
  historical repository exposure means it is potentially known. Decide whether
  the signed method=password, viewer-only, thirty-minute session materially
  contains that risk now that it authorizes only a dedicated fixed aggregate
  metrics DTO and logout; all customer records, transcripts, voice detail,
  events, analytics/queues, and mutations require managed-token step-up.
  Recheck every prior blocker, especially round twelve's reproduced semantic
  false greens: destructuring `globalThis.process` directly; recovering module
  identity from a container before reflected `require`; nested and assignment
  destructuring of global `Object`; compound late insertion of an allowed
  export; double-call and bound prototype receiver mutation; and indexed or
  concatenated dynamic invocation vectors. Confirm fixed-point identity now
  propagates through property access, reflection, nested/assignment
  destructuring, arrays/objects, late writes, every value-returning assignment,
  and function-return bridges. Resolve direct, stored-bound, call/apply,
  double/nested-call, and Reflect.apply mutation to the actual receiver. Confirm
  indexed, push-built, concatenated, spread, and mutation-built vectors connect
  inserted authority to the real target. Every exact and broader hostile fixture
  must fail while safe reflected lookalikes, harmless global mutations, safe
  vectors, prototype calls, stored bound calls, and source-only export
  construction remain usable.
  Recheck aggregate bounds, whole-program authority admission, effective
  Next-config route extension governance, complete route/export closure,
  one-time private claims, collision cross-products, canonical-origin rejection,
  hard-fail release E2E, zero-skipped reporting, and safe telemetry.
  Inspect and recompute hashes for every attached raw artifact:
  github-evidence.json, source-ci.log, integration-ci.log,
  integration-merge-dag.txt, source-to-integration-overlap.diff,
  integration-vitest.json, integration-audit.json, the final live PR/check
  evidence, and source-to-live-head.diff. Confirm source CI run 30404758773,
  job/check 90427616285, suite 82414100760, event pull_request, checked-out SHA
  1142708546e31e1f1ed225448ae955e0059e6a11, and tree
  0bb7c3de96316c7bd1832c3efc303d8d21a99614. Confirm integration CI run
  30405004341, job/check 90428369693, suite 82414755723, event pull_request,
  checked-out commit 6c7c831004a8ee9c9d80e11442e45f0699537c22, tree
  6031abd05700d532352bf18cb698b860a497f875, all eight listed exact heads and
  first-parent composition, frozen pnpm 10.34.5 install, warning-free lint on
  the raw CI count of 294 files, strict TypeScript, zero production audit
  findings across 378 dependencies, all 89 files and 2,337 tests, Next.js
  16.2.12 build, and mobile performance.
  Compare the live PR head and source-to-live-head diff with the implementation
  commit and reject any non-APR descendant change. Treat live cookie flags,
  password/viewer thirty-minute claims, password bearer rejection,
  review-token configured role and twelve-hour claims, Redis store/shared
  remaining-count exhaustion, raw-route 403s, managed HMAC readback,
  exact-SHA staging, Convex-first release, and guarded same-SHA production proof
  as mandatory post-merge gates; do not misstate them as already complete.
  End with `VERDICT: MERGE` or `VERDICT: DO NOT MERGE` on its own final line.

