name: oriental-admin-password-security
description: Exact-tree security review for Oriental interactive admin password management

documents:
  readme: AGENTS.md
  spec: .apr/specs/oriental-admin-password-security.md
  implementation: .apr/evidence/oriental-admin-password-security.md

oracle:
  model: "gpt-5.6-sol"

rounds:
  output_dir: .apr/rounds/oriental-admin-password-security
  impl_every_n: 1

template: |
  Perform an adversarial exact-tree security and release review of the Oriental
  interactive admin password change. Confirm that no plaintext password,
  hard-coded verifier, or recoverable unsalted digest is present in the branch;
  the owner-selected human password is accepted only by the same-origin,
  rate-limited interactive login; and ADMIN_REVIEW_TOKEN remains the
  high-entropy bearer and signed-session key. Recheck domain separation,
  HMAC-format validation, constant-time comparison, token-rotation behavior,
  managed Infisical-to-Coolify reconciliation, UI/API documentation, and
  focused negative tests. Staging and production secret materialization can
  only occur after merge; retain exact-SHA staging, browser login, and
  production verification as mandatory post-merge gates. Decide whether this
  exact branch head may merge. End with `VERDICT: MERGE` or
  `VERDICT: DO NOT MERGE` on its own final line.

