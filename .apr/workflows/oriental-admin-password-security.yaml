name: oriental-admin-password-security
description: Exact-tree security review for Oriental interactive admin password management

documents:
  readme: .apr/evidence/oriental-admin-password-security.md
  spec: .apr/specs/oriental-admin-password-security.md
  implementation: .apr/evidence/oriental-admin-password-security.patch

oracle:
  model: "gpt-5.6-sol"

rounds:
  output_dir: .apr/rounds/oriental-admin-password-security
  impl_every_n: 1

template: |
  Perform an adversarial exact-tree security and release review of implementation
  commit 4e61d8de8caf00520d72a0bcbf14c015b4e40a85, tree
  8c8c5571f5753c032735dff1d78b3e28417e45d0, using the attached source-only
  patch, evidence manifest, raw support artifacts, and prior round responses.
  The owner requires the reaffirmed password even though historical repository
  exposure means it is potentially known. Decide whether the signed
  method=password, viewer-only, thirty-minute session materially contains that
  risk when it authorizes only a fixed aggregate metrics DTO and logout; all raw
  records, PII, transcripts, voice detail, analytics/queues, and mutations
  require managed-token step-up.

  Reproduce and recheck the round-sixteen blocker in both directions: write a
  property through a receiver created by object, nested-object, assignment,
  array, nested-array, or array-assignment destructuring and read it through the
  original receiver, then reverse the write/read direction. Include functions
  extracted through array members and cross-file imported helpers exporting the
  original receiver and holder. Confirm `assignedMemberPaths` is consumed by the
  canonical receiver graph, object-literal shorthand values and numeric array
  elements project into that graph, binding paths are indexed before property
  writes, and the same canonical result feeds privileged-loader admission,
  allowed-export mutation, private-authority taint, actual receivers, return
  summaries, and dynamic vectors. Require exact hostile and safe twins for every
  reproduced form. Also recheck every round-fifteen Function/Reflect mediation,
  cross-file, and production-program repair; reject a syntax-only special case.

  Confirm production admission still uses the complete governed production
  program. For changed auth-source differentials, confirm the cached TypeScript
  language service uses the production compiler configuration, real transitive
  imports, one governed program per override, and an auth-source-scoped index
  shared by every auth export analysis. Reject a return to the standalone
  no-resolve source program, an increased timeout, skipped coverage, or any
  semantic weakening. Recheck aggregate bounds, whole-program authority
  admission, effective Next-config route governance, route/export closure,
  one-time private claims, collision cross-products, canonical-origin rejection,
  hard-fail release E2E, zero-skipped reporting, and safe telemetry.

  Recompute all attached byte counts and SHA-256 values for the source patch,
  github-evidence.json, integration-github-evidence.json, source-ci.log,
  integration-ci.log, integration-merge-dag.txt,
  source-to-integration-overlap.diff, integration-vitest.json,
  integration-audit.json, round_13.md, round_14.md, round_15.md, and round_16.md.
  Confirm source CI run 30424510554, job/check 90487908020, suite 82467831487,
  event pull_request, SHA 4e61d8de8caf00520d72a0bcbf14c015b4e40a85, and tree
  8c8c5571f5753c032735dff1d78b3e28417e45d0 are exact and successful. Confirm
  integration CI run 30424542369, job/check 90488000700, suite 82467915381,
  event pull_request, SHA f32e396c08dd909534cbf08894308e4672ee070b,
  tree 93e6a4e898865ace935b596405260471d7690ea8, and all eight exact PR
  heads are successful. Verify frozen pnpm 10.34.5, zero audit findings across
  378 dependencies, warning-free lint on 294 files, strict TypeScript, all 89
  files and 2,337 tests, Next.js 16.2.12, and mobile performance.

  Inspect the attached final-head GitHub evidence, raw CI log, and
  source-to-live-head diff captured after the evidence-only commit. Confirm they
  match the current live PR head and tree, exact successful check run and suite,
  and contain no non-APR descendant change after the implementation commit.
  Treat managed HMAC readback, exact-SHA staging, clean-cookie live auth and 403
  proof, Redis shared exhaustion, Convex-first release, and guarded identical-SHA
  production promotion as mandatory post-merge gates, not completed evidence.
  End with `VERDICT: MERGE` or `VERDICT: DO NOT MERGE` on its own final line.

