  nonempty, and namespaced away from review IDs; inferred edges must require
  one consistent conservative canonical normalized email on every call; the
  stored value must already equal its normalized form byte-for-byte, rejecting
  raw, missing, case-foldable, trim-recoverable, malformed,
  whitespace/control-bearing, or conflicting identity; the sixty-minute test
  must compare actual calls rather than sparse intervals; nearest selection
  must exercise several compatible clusters; equal-gap selection and every
  equal-time ordering must use exact code-unit opaque-ID comparisons, never
  locale collation, and remain deterministic under every permutation, including
  all 24 Unicode equal-gap and all six equal-time arrangements with
  canonically distinct Unicode IDs; every original row reference must occur
  exactly once across all grouping branches; and inputs and persistence must
  not mutate. Do not waive exact-head CI, combined-tree admission, or final
  staging verification. End with `VERDICT: MERGE` or
  `VERDICT: DO NOT MERGE` on its own final line.
