<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="g" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#28518a" stop-opacity="0.5"></stop>
      <stop offset="50%" stop-color="#1f3f7c" stop-opacity="0.2"></stop>
      <stop offset="100%" stop-color="#100d18" stop-opacity="0"></stop>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"></path>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#100d18"></rect>
  <rect width="1200" height="630" fill="url(#grid)"></rect>
  <rect width="1200" height="630" fill="url(#g)"></rect>

  
  <g font-family="Poppins, sans-serif" fill="rgba(255,255,255,0.55)" font-size="20" letter-spacing="6" font-weight="500">
    <circle cx="80" cy="103" r="4" fill="#5c7db8"></circle>
    <text x="100" y="110">A NEW CHAPTER FOR A HISTORIC BUILDING</text>
  </g>

  
  <g font-family="Poppins, sans-serif" font-weight="800" letter-spacing="-3">
    <text x="80" y="248" font-size="120" fill="#ffffff">Reimagining</text>
    <text x="80" y="370" font-size="120" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.5">Oriental.</text>
  </g>

  <g font-family="Fraunces, Georgia, serif" font-style="italic" font-weight="300">
    <text x="80" y="492" font-size="120" fill="#5c7db8">A future</text>
    <text x="520" y="492" font-size="120" fill="#ffffff" font-family="Poppins, sans-serif" font-style="normal" font-weight="800" letter-spacing="-3">we build together.</text>
  </g>

  
  <g font-family="Poppins, sans-serif" fill="rgba(255,255,255,0.55)" font-size="22" letter-spacing="5" font-weight="500">
    <text x="80" y="585">ORIENTAL · LEVELS 2–4 · KUALA LUMPUR</text>
    <text x="1120" y="585" text-anchor="end">oriental.mereka.io</text>
  </g>

  
  <g transform="translate(1020, 145)" opacity="0.92">
    <circle cx="35" cy="35" r="35" fill="none" stroke="#5c7db8" stroke-width="3"></circle>
    <circle cx="85" cy="35" r="35" fill="none" stroke="#1f3f7c" stroke-width="3"></circle>
  </g>
</svg>