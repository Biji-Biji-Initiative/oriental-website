name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Attest checkout identity
        shell: bash
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          checkout_tree="$(git rev-parse 'HEAD^{tree}')"
          test "$checkout_sha" = "$GITHUB_SHA"
          printf 'checkout_sha=%s\ncheckout_tree=%s\n' "$checkout_sha" "$checkout_tree"
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check-secrets
      - run: pnpm build
      - run: pnpm test:performance
      - name: Upload performance failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-performance-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
