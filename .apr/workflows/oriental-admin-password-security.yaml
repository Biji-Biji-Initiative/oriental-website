name: oriental-admin-password-security
description: Exact-tree security review for Oriental interactive admin password management

documents:
  readme: .apr/evidence/oriental-admin-password-security.md
  spec: .apr/specs/oriental-admin-password-security.md
  implementation: .apr/evidence/oriental-admin-password-security.patch

oracle:
  model: "gpt-5.6-sol"

rounds:
  output_dir: .apr/rounds/oriental-admin-password-security
  impl_every_n: 1

template: |
  Perform an adversarial exact-tree security and release review of implementation
  commit 36d7a40ebfb81d8a1018ba69de10bae410f253ba using the source-only patch and
  evidence manifest. The owner requires the reaffirmed password even though
  historical repository exposure means it is potentially known. Decide whether
  the signed method=password, viewer-only, thirty-minute session materially
  contains that risk now that it authorizes only a dedicated fixed aggregate
  metrics DTO and logout; all customer records, transcripts, voice detail,
  events, analytics/queues, and mutations require managed-token step-up.
  Recheck every round-four blocker: neither the password page nor metrics route
  may invoke the broad dashboard; the Convex and Next return types must remain
  fixed and runtime-projected; the exact path/method/permission map must reject
  mutable, destructured, assigned, re-exported, CommonJS, extra-login, and
  wrong-permission handlers across every extension; session minting must require
  module-private runtime provenance; TypeScript-resolved complete-runtime scans
  must catch relative, dynamic, require, import-equals, namespace, and re-export
  access; collision, rotation, invalid-Authorization, and independent-identity
  tests must be explicit; documentation must not claim unproven live state.
  Confirm exact-head GitHub CI and the 89-file/2,278-test combined integration.
  Do not waive exact-SHA staging, live reduced-session proof, or guarded
  production verification. End with `VERDICT: MERGE` or
  `VERDICT: DO NOT MERGE` on its own final line.

