name: oriental-dropped-session-observability
description: Exact-range data-integrity review for lost close snapshots and orphan alerts

documents:
  readme: .apr/evidence/oriental-dropped-session-observability.md
  spec: .apr/specs/oriental-dropped-session-observability.md
  implementation: .apr/evidence/oriental-dropped-session-observability.patch

oracle:
  model: "gpt-5.6-sol"

rounds:
  output_dir: .apr/rounds/oriental-dropped-session-observability
  impl_every_n: 1

template: |
  Perform an adversarial exact-range data-integrity and operations review of
  Oriental dropped-session implementation commit
  7efaad2e01683c1a44e5ee6c65c417a06178a3c0. Review the complete patch after
  stacked base 75f42e3205ac65f50e0a76bd7a58a2b651726ad2. Recheck every
  round-one blocker: lifecycle membership must be selected by a compound index
  before the cap; real orphans must not age out through a lower lookback; the
  stale floor must derive from the maximum valid call and heartbeat policy;
  failed, timed-out, or either migration-pending population must remain unknown
  rather than zero; both unsafe legacy rows and safe rows missing lifecycle
  state must be checked with bounded queries; the lifecycle release mutation
  must patch only sessionState and preserve every non-lifecycle field exactly;
  unsafe payload normalization/retention must remain separately governed; query,
  RPC, and total child-process latency must be bounded with process-group kill
  before external mutation; and both web deploy entrypoints must fail before
  external mutation unless Convex is deployed, migrated, and queryable. Also
  confirm client failure reporting stays PII-free and only ops automation can
  invoke the SLA route. End with `VERDICT: MERGE` or `VERDICT: DO NOT MERGE`
  on its own final line.

