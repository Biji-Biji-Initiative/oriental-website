name: CI

# This job serves pull_request, so it executes PR-authored source. It must not
# move to a credentialed self-hosted lane (arc-standard carries cluster/secret
# authority). Its destination is the ADR-047 fastlane untrusted PR sandbox on
# Obad, which is built but not yet activated; until then this stays hosted
# deliberately, not by oversight.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Attest checkout identity
        env:
          EXPECTED_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          checkout_tree="$(git rev-parse 'HEAD^{tree}')"
          test "$checkout_sha" = "$EXPECTED_CHECKOUT_SHA"
          printf 'checkout_sha=%s\ncheckout_tree=%s\n' "$checkout_sha" "$checkout_tree"
      - uses: pnpm/action-setup@v5
        with:
          version: 10.34.5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Record dependency audit toolchain
        run: |
          pnpm --version
          pnpm config get registry
      - run: pnpm audit:prod
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check-secrets
      - run: pnpm build
      - run: pnpm test:performance
      - name: Upload performance failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-performance-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
